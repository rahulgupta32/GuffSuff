[package]
name = "openmls-prerelease-spike"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
openmls = { version = "0.9.0-rc.2", default-features = false, features = ["test-utils"] }
openmls_rust_crypto = "0.6.0-rc.2"
openmls_traits = "0.6.0-rc.2"
openmls_basic_credential = "0.6.0-rc.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
