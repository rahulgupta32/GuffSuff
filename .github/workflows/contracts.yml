name: Contract Compatibility Check

on:
  push:
    branches: [main, build/development-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c08001712a433a0b1ce48261 # v4.1.0
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: "11.20.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
