name: IaC Infrastructure Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: bridgecrewio/checkov-action@1a1827fa6a2d61cfedc35c66b8d9600a9d16a5b2 # v12.2934.0
        with:
          framework: dockerfile,compose
