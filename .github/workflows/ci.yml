name: Continuous Integration

on:
  push:
    branches: [main, build/development-platform]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.1.0
        with:
          node-version: "24.15.0"

      - name: Validate Markdown & Configuration
        run: |
          echo "Validating configuration files and markdown documentation..."
          test -f README.md
          test -f SECURITY.md
          test -f docs/PRODUCT_REQUIREMENTS.md
          test -f docs/SYSTEM_ARCHITECTURE.md
          test -f docs/DECISION_LOG.md

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
