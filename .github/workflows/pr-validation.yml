name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c08001712a433a0b1ce48261 # v4.1.0
        with:
          node-version: "24.15.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78d470a0e91a56730248c89b3922d55c70 # v4.0.0
        with:
          version: "11.20.0"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Typecheck
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
