name: SAST Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9e8d4cfdd869724b6823b497677d242f36d1b32d # v3.28.10
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9e8d4cfdd869724b6823b497677d242f36d1b32d # v3.28.10
