name: SAST Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@9e8d4cfdd869724b6823b497677d242f36d1b32d # v3.28.10
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9e8d4cfdd869724b6823b497677d242f36d1b32d # v3.28.10
