name: Lockfile Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a3252b78d470a0e91a56730248c89b3922d55c70 # v4.0.0
        with:
          version: "11.20.0"
      - run: pnpm install --frozen-lockfile
