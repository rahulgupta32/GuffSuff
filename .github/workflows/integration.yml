name: Integration Tests

on:
  push:
    branches: [main, build/development-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-transport-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_DB: guffsuff_integration
          POSTGRES_USER: guffsuff_user
          POSTGRES_PASSWORD: integration_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guffsuff_user -d guffsuff_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://guffsuff_user:integration_only_password@localhost:5432/guffsuff_integration
      GUFFSUFF_INTEGRATION_DATABASE: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.1.0
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: "11.20.0"
      - run: pnpm install --frozen-lockfile
      - name: Build API and dependencies
        run: pnpm exec turbo run build --filter=@guffsuff/api...
      - name: Apply all database migrations
        run: pnpm --filter @guffsuff/database migrate
      - name: Exercise concurrent transport against PostgreSQL
        run: node scripts/transport-integration.mjs
