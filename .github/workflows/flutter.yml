name: Flutter Mobile Check

on:
  push:
    branches: [main, build/development-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-android-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.29.2"
          channel: "stable"
      - name: Verify Flutter & Execute Static Analysis
        run: |
          cd apps/mobile
          flutter --version
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          if [ -d "test" ]; then flutter test; fi

      - name: Validate Android Flavor Build Configurations
        run: |
          cd apps/mobile
          flutter build apk --target lib/main.dart --no-pub --debug

      - name: Verify official libsignal native identity serialization
        run: |
          cd apps/mobile/android
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify identity persistence with AndroidKeyStore
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          working-directory: apps/mobile/android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

  flutter-ios-compile-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.29.2"
          channel: "stable"
      - name: Validate iOS Compile & Dependency Resolution
        run: |
          cd apps/mobile
          flutter pub get
          flutter create --platforms=ios .
          flutter build ios --no-codesign --target lib/main.dart
